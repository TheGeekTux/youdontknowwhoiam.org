<script>
  // Variable global para almacenar el tiempo transcurrido total acumulado
  var totalElapsedTime = 0;
  var timerInterval;

  // Bloquear clic derecho en toda la página
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // Bloquear combinaciones de teclado críticas
  document.addEventListener('keydown', function(e) {
    // Bloquear F12
    if (e.key === 'F12' || e.keyCode === 123) {
      e.preventDefault();
      return false;
    }
    // Bloquear Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
      e.preventDefault();
      return false;
    }
    // Bloquear Ctrl+U (Ver código fuente)
    if (e.ctrlKey && (e.key === 'U' || e.keyCode === 85)) {
      e.preventDefault();
      return false;
    }
    // Bloquear Ctrl+S (Guardar página) o Cmd+S en Mac
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) {
      e.preventDefault();
      return false;
    }
  });

  // Intercepta el intento de cerrar la pestaña, ventana o recargar la página
  window.addEventListener('beforeunload', function (e) {
    e.preventDefault();
    e.returnValue = ''; 
  });

  // Function to update the timer
  function updateTimer() {
    totalElapsedTime += 1000;
    localStorage.setItem('idiotTimerProgress', totalElapsedTime);

    var elapsedTime = totalElapsedTime;

    var years = Math.floor(elapsedTime / (1000 * 60 * 60 * 24 * 365));
    elapsedTime -= years * (1000 * 60 * 60 * 24 * 365);
    var months = Math.floor(elapsedTime / (1000 * 60 * 60 * 24 * 30.44));
    elapsedTime -= months * (1000 * 60 * 60 * 24 * 30.44);
    var weeks = Math.floor(elapsedTime / (1000 * 60 * 60 * 24 * 7));
    elapsedTime -= weeks * (1000 * 60 * 60 * 24 * 7);
    var days = Math.floor(elapsedTime / (1000 * 60 * 60 * 24));
    elapsedTime -= days * (1000 * 60 * 60 * 24);
    var hours = Math.floor(elapsedTime / (1000 * 60 * 60));
    elapsedTime -= hours * (1000 * 60 * 60);
    var minutes = Math.floor(elapsedTime / (1000 * 60));
    elapsedTime -= minutes * (1000 * 60);
    var seconds = Math.floor(elapsedTime / 1000);

    var timerString = 'Time Elapsed:';
    if (years > 0) timerString += ' ' + years + ' year' + (years > 1 ? 's,' : ',');
    if (months > 0) timerString += ' ' + months + ' month' + (months > 1 ? 's,' : ',');
    if (weeks > 0) timerString += ' ' + weeks + ' week' + (weeks > 1 ? 's,' : ',');
    if (days > 0) timerString += ' ' + days + ' day' + (days > 1 ? 's,' : ',');
    if (hours > 0) timerString += ' ' + hours + ' hour' + (hours > 1 ? 's,' : ',');
    if (minutes > 0) timerString += ' ' + minutes + ' minute' + (minutes > 1 ? 's,' : ',');
    if (seconds > 0) timerString += ' ' + seconds + ' second' + (seconds > 1 ? 's' : '');

    document.getElementById('timer').textContent = timerString;
  }

  // Function to start the timer
  function startTimer() {
    var savedProgress = localStorage.getItem('idiotTimerProgress');
    
    if (savedProgress !== null) {
      totalElapsedTime = parseInt(savedProgress, 10);
    } else {
      var startDate = new Date('2025-05-18T00:00:00');
      var currentTime = new Date();
      totalElapsedTime = currentTime - startDate;
    }
    
    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
  }

  window.onload = startTimer;
</script>
